name: Contract tests
on:
  push:
    branches: [dev, main, 'feat/**', 'refactor/**']
  pull_request:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - run: python -m pip install --no-index --find-links dist driftlens-sql-agent
      - run: python -m compileall -q src tests
      - run: python -m unittest discover -s tests/unit -p "test_*.py" -v
