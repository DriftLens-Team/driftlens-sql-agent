[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "driftlens-sql-agent"
version = "0.1.0.dev0"
description = "Bounded SQL agent core for DriftLens (live transport pending)"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
driftlens-sql-agent = "driftlens_sql_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
driftlens_sql_agent = ["prompts/*.txt"]
